name: Database

on:
  push:
  pull_request:

jobs:
  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm lida de package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Instala a Supabase CLI fixada em devDependencies (mesma versão que localmente).
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: pnpm db:start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,realtime

      - name: Reset database (migrations + seed)
        run: pnpm db:reset

      - name: pgTAP tests
        run: pnpm db:test

      - name: Lint
        run: pnpm db:lint

      - name: Types in sync with the schema
        run: |
          pnpm types:gen
          git diff --exit-code -- src/types/database.ts
