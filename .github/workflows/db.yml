name: Database

on:
  push:
  pull_request:

jobs:
  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm lida de package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Instala a Supabase CLI fixada em devDependencies (mesma versão que localmente).
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: pnpm db:start -x studio,imgproxy,logflare,vector,supavisor,realtime

      - name: Reset database (migrations + seed)
        run: pnpm db:reset

      - name: pgTAP tests
        run: pnpm db:test

      - name: Lint
        run: pnpm db:lint

      - name: Serve Edge Functions
        run: |
          pnpm functions:serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/confirm-property-image || true)
            [ "$code" = "401" ] && exit 0
            sleep 2
          done
          cat functions.log
          exit 1

      - name: Integration tests (concurrency, Storage and Edge Functions over HTTP)
        run: pnpm test:integration

      - name: Types in sync with the schema
        run: |
          pnpm types:gen
          git diff --exit-code -- src/types/database.ts
